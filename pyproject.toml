[project]
name = "patient-management-system"
version = "0.1.0"
description = "Patient Management System REST API built with FastAPI and Pydantic"
readme = "README.md"
authors = [
    { name = "Arjit Katiyar" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
